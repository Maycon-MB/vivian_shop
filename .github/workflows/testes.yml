# Confere tudo a cada envio e, se passar, publica.
#
# Existe porque até pouco tempo os testes só rodavam se eu lembrasse, e a
# publicação era um comando na minha mão. Os dois erros mais caros deste
# projeto — o botão de comprar que virou link morto e o total que apareceu
# como "R$ NaN" — passaram por build, lint e testes de unidade. O que pegou
# os dois foi olhar a tela.
#
# Por isso a conferência aqui não para no `npm test`. Ela sobe o site
# montado e, contra ele: compra de ponta a ponta, passa o pente fino de
# acessibilidade e mede peso e tempo de cada tela.
#
# A publicação só acontece depois que tudo isso passa, e só na branch
# principal. É a ordem que importa: automatizar a publicação antes de a
# rede de segurança existir seria só publicar o erro mais rápido.

name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: loja/package-lock.json

      # `npm ci` e não `npm install`: instala exatamente o que está no
      # package-lock. Uma versão diferente aqui do que roda na minha
      # máquina transformaria esta conferência numa loteria.
      - name: instalar
        run: npm ci
        working-directory: loja

      - name: tipos
        run: npx tsc --noEmit
        working-directory: loja

      - name: lint
        run: npx eslint src --ext .ts,.tsx,.js,.jsx --max-warnings 40
        working-directory: loja

      - name: regras de negócio e telas
        run: npm test
        working-directory: loja

      # Monta pelo mesmo script que publica, e não por `next build` direto:
      # o que vai ao ar tem o CNAME do domínio próprio e os
      # redirecionamentos dos endereços antigos. Testar artefato diferente
      # do publicado é testar outra coisa.
      # O endereço que recebe as respostas da Vivian é uma variável do
      # repositório, e não um segredo: ele vai dentro do JavaScript da
      # página, então qualquer pessoa que abra o site consegue lê-lo de
      # qualquer forma. Guardá-lo como segredo daria uma falsa sensação
      # de proteção. O que o protege é ser um endereço longo e aleatório
      # que só escreve, nunca lê.
      # Diz em voz alta se o endereço de recebimento chegou até aqui. Sem
      # isto, uma variável criada na aba errada (Secrets em vez de
      # Variables) some sem avisar: o site publica normalmente, só sem o
      # botão de enviar, e a descoberta acontece dias depois.
      - name: conferir o endereço de recebimento
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_FORMULARIO_URL }}" ]; then
            echo "::warning::A variável NEXT_PUBLIC_FORMULARIO_URL está vazia. O formulário vai publicar sem o botão de enviar. Confira em Settings > Secrets and variables > Actions, aba Variables (não Secrets)."
          else
            echo "endereço de recebimento presente, ${#URL} caracteres, começa com: $(echo "$URL" | cut -c1-45)"
          fi
        env:
          URL: ${{ vars.NEXT_PUBLIC_FORMULARIO_URL }}

      - name: montar o site como vai ao ar
        run: node scripts/publicar.mjs
        env:
          NEXT_PUBLIC_FORMULARIO_URL: ${{ vars.NEXT_PUBLIC_FORMULARIO_URL }}
          DOMINIO_PRONTO: ${{ vars.DOMINIO_PRONTO }}
          # Não são segredo: vão dentro do JavaScript da página de qualquer
          # forma. Quem protege os dados é a política do banco.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # A chave pública do Mercado Pago. Também não é segredo: ela vai
          # dentro da página, e é o que o formulário de pagamento precisa
          # para desenhar os campos deles. Quem cobra é o Access Token, que
          # vive nos segredos da Edge Function e nunca sai do servidor.
          NEXT_PUBLIC_MERCADOPAGO_CHAVE: ${{ vars.NEXT_PUBLIC_MERCADOPAGO_CHAVE }}

      # Onde a loja mora muda com a variável DOMINIO_PRONTO, e os testes
      # precisam bater no mesmo caminho que a publicação montou. Calcular
      # aqui, uma vez, evita quatro lugares para esquecer de mudar no dia
      # em que a chave virar.
      - name: descobrir o endereço da loja montada
        run: |
          if [ "${{ vars.DOMINIO_PRONTO }}" = "true" ]; then
            echo "BASE_DA_LOJA=http://127.0.0.1:4173" >> "$GITHUB_ENV"
            echo "a loja foi montada na raiz, com o domínio próprio"
          else
            echo "BASE_DA_LOJA=http://127.0.0.1:4173/vivian_shop" >> "$GITHUB_ENV"
            echo "a loja foi montada sob /vivian_shop"
          fi

      # O servidor próprio comprime, como o GitHub Pages comprime. Sem
      # isso, a medição de peso mede o texto cru e acusa três vezes o que
      # realmente trafega.
      - name: subir o site
        run: |
          node scripts/servir.cjs 4173 &
          npx --yes wait-on "$BASE_DA_LOJA/" --timeout 60000
        env:
          DOMINIO_PRONTO: ${{ vars.DOMINIO_PRONTO }}

      - name: instalar o navegador
        run: npx playwright install --with-deps chromium
        working-directory: loja

      - name: comprar de ponta a ponta
        run: node scripts/testar-navegacao.cjs
        env:
          # Conta de teste que é dona da loja. Sem ela, as telas da Vivian
          # são puladas em vez de falharem: quem clona o repositório não
          # tem acesso ao banco.
          TESTE_DONA_EMAIL: ${{ secrets.TESTE_DONA_EMAIL }}
          TESTE_DONA_SENHA: ${{ secrets.TESTE_DONA_SENHA }}

      - name: acessibilidade
        run: node scripts/testar-acessibilidade.cjs

      - name: peso e tempo das telas
        run: node scripts/medir-desempenho.cjs

      # Quando a compra falha, a mensagem de erro raramente basta: o que
      # resolve é ver a tela no instante em que quebrou.
      - name: guardar as telas quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telas-da-falha
          path: loja/telas-da-falha/
          if-no-files-found: ignore
          retention-days: 7

      # O site já montado segue para a publicação sem ser montado de novo:
      # publicar um artefato diferente do que foi testado anularia o teste.
      #
      # O botão "Run workflow" também publica. Sem isso, mudar uma variável
      # do repositório (DOMINIO_PRONTO, o endereço do formulário) não tinha
      # como chegar ao ar: só rodava os testes, e era preciso inventar um
      # commit vazio para publicar.
      - name: guardar o site montado
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 1

  publicar:
    needs: conferir
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: pegar o site que passou nos testes
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # O `.nojekyll` é o que impede o GitHub de ignorar a pasta `_next`,
      # cujo nome começa com underscore. Sem ele, o site publica e abre
      # sem nenhum estilo nem JavaScript.
      - name: conferir o .nojekyll antes de publicar
        run: |
          test -f dist/.nojekyll || { echo "faltou o .nojekyll — o site publicaria quebrado"; exit 1; }
          test -f dist/index.html || { echo "faltou o index.html"; exit 1; }

      - name: publicar
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: 'publica ${{ github.sha }}'
